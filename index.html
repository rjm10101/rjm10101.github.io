<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ray Mark</title>
    <meta name="description" content="Ray Mark — Director of Marketing, Cirque du Soleil ʻAuana, Honolulu">
    <meta property="og:title" content="Ray Mark">
    <meta property="og:description" content="Director of Marketing · Cirque du Soleil Entertainment Group">
    <meta name="theme-color" content="#0a0907">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YQDXZEPYT9"></script>
    <script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        @font-face {
            font-family: 'Dala Floda';
            src: url('./assets/fonts/DalaFloda-Bold-Web.woff2') format('woff2'),
                 url('./assets/fonts/DalaFloda-Bold-Web.woff') format('woff');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --gold:      #B8924C;
            --gold-hi:   #D4AB62;
            --cream:     #F0EAE0;
            --muted:     rgba(240,234,224,0.5);
            --dim:       rgba(240,234,224,0.28);
            --rule:      rgba(184,146,76,0.16);
            --card-bg:   #131108;
            --ease:      cubic-bezier(0.16, 1, 0.3, 1);
        }

        html { height: 100%; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
            background-color: #08070500;
            background-image:
                radial-gradient(ellipse 70% 60% at 50% 50%, rgba(184,146,76,0.055) 0%, transparent 70%),
                radial-gradient(rgba(184,146,76,0.065) 1px, transparent 1px);
            background-size: 100% 100%, 22px 22px;
            background-color: #090805;
        }

        /* ── Card ── */
        .card {
            position: relative;
            width: min(420px, 100%);
            border-radius: 22px;
            border: 1px solid rgba(184,146,76,0.2);
            overflow: hidden;
            background: linear-gradient(160deg, #1c1810 0%, #111009 45%, #0d0b07 100%);
            box-shadow:
                0 0 0 1px rgba(184,146,76,0.05),
                0 25px 50px rgba(0,0,0,0.65),
                0 70px 130px rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(184,146,76,0.18);
            transform: perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1);
            transition: box-shadow 0.4s ease;
            will-change: transform;
            opacity: 0;
            animation: cardrise 1s var(--ease) 0.1s forwards;
        }

        /* Traveling shimmer on top stripe */
        .card::before {
            content: '';
            display: block;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%,
                var(--gold) 35%,
                var(--gold-hi) 50%,
                var(--gold) 65%,
                transparent 100%
            );
            background-size: 250% 100%;
            animation: stripe 4s ease-in-out infinite;
        }

        /* Mouse-follow sheen */
        .sheen {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 9;
            border-radius: 22px;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 0%, transparent 60%);
            transition: background 0.05s linear;
        }

        .card-inner {
            padding: 1.75rem 2rem 2rem;
        }

        /* ── Company ── */
        .company {
            margin-bottom: 1.6rem;
        }
        .company-name {
            display: block;
            font-size: 0.585rem;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gold);
        }
        .company-sub {
            display: block;
            font-size: 0.585rem;
            font-weight: 400;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(184,146,76,0.48);
        }

        /* ── Identity ── */
        .identity { margin-bottom: 0.2rem; }

        .name {
            font-family: 'Dala Floda', Georgia, 'Times New Roman', serif;
            font-size: clamp(3.6rem, 15vw, 5.4rem);
            font-weight: 700;
            line-height: 0.87;
            letter-spacing: -0.03em;
            color: var(--cream);
            margin-bottom: 0.85rem;
            user-select: none;
        }

        .role { display: flex; flex-direction: column; gap: 0.18rem; }

        .job-title {
            font-size: 0.78rem;
            font-weight: 400;
            letter-spacing: 0.03em;
            color: var(--muted);
        }
        .show-name {
            font-size: 0.72rem;
            font-style: italic;
            letter-spacing: 0.05em;
            color: rgba(184,146,76,0.6);
        }

        /* ── Divider ── */
        .rule { height: 1px; background: var(--rule); margin: 1.3rem 0; }

        /* ── Weather / Time ── */
        .widget {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
            align-items: center;
        }

        .weather-left { display: flex; flex-direction: column; gap: 0.3rem; }
        .weather-right { text-align: right; display: flex; flex-direction: column; gap: 0.2rem; }

        .widget-label {
            font-size: 0.58rem;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--dim);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .widget-label svg { opacity: 0.6; }

        .weather-row {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
        }
        .w-icon { font-size: 1.3rem; line-height: 1; }
        .w-temp {
            font-size: 1.75rem;
            font-weight: 200;
            letter-spacing: -0.04em;
            color: var(--cream);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .w-unit { font-size: 0.7rem; color: var(--dim); }
        .w-desc { font-size: 0.62rem; color: var(--dim); letter-spacing: 0.04em; }

        .local-time {
            font-size: 1.6rem;
            font-weight: 200;
            letter-spacing: -0.03em;
            color: var(--cream);
            line-height: 1;
            font-variant-numeric: tabular-nums;
            justify-content: flex-end;
            display: flex;
            align-items: baseline;
            gap: 0.2rem;
        }
        .local-ampm { font-size: 0.65rem; color: var(--dim); align-self: flex-end; margin-bottom: 0.15rem; }
        .local-date { font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }

        /* ── Contact ── */
        .contact-list { display: flex; flex-direction: column; gap: 0.7rem; }

        .contact-row {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            text-decoration: none;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.45rem 0.6rem;
            border-radius: 10px;
            width: 100%;
            text-align: left;
            color: var(--muted);
            transition: background 0.2s, color 0.2s;
        }
        .contact-row:hover {
            background: rgba(184,146,76,0.07);
            color: var(--cream);
        }

        .c-icon {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: rgba(184,146,76,0.09);
            border: 1px solid rgba(184,146,76,0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            transition: background 0.2s, border-color 0.2s;
        }
        .contact-row:hover .c-icon {
            background: rgba(184,146,76,0.16);
            border-color: rgba(184,146,76,0.28);
        }

        .c-text {
            flex: 1;
            font-size: 0.73rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .c-badge {
            font-size: 0.56rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.22rem 0.55rem;
            border-radius: 5px;
            background: rgba(184,146,76,0.08);
            border: 1px solid rgba(184,146,76,0.18);
            color: var(--gold);
            transition: background 0.25s, border-color 0.25s, color 0.25s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .c-badge.ok {
            background: rgba(80,180,120,0.12);
            border-color: rgba(80,180,120,0.28);
            color: #5fc98a;
        }

        /* ── vCard button ── */
        .vcf-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            width: 100%;
            padding: 0.88rem 1.5rem;
            border-radius: 12px;
            background: rgba(240,234,224,0.92);
            color: #111009;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            text-decoration: none;
            transition: background 0.25s ease, transform 0.2s var(--ease), box-shadow 0.25s;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        .vcf-btn:hover {
            background: #f4ede0;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
        }
        .vcf-btn:active { transform: translateY(0); }

        /* ── Animations ── */
        @keyframes cardrise {
            from { opacity: 0; transform: perspective(1000px) translateY(36px) rotateX(3deg) scale(0.98); }
            to   { opacity: 1; transform: perspective(1000px) translateY(0)    rotateX(0deg) scale(1);    }
        }

        @keyframes stripe {
            0%   { background-position: 200% 0; }
            50%  { background-position: -50% 0; }
            100% { background-position: 200% 0; }
        }

        /* ── Reduced motion ── */
        @media (prefers-reduced-motion: reduce) {
            .card { animation: none; opacity: 1; }
            .card::before { animation: none; }
            .card, .vcf-btn, .contact-row { transition: none; }
        }
    </style>
</head>
<body>
    <article class="card" id="card">
        <div class="sheen" id="sheen"></div>

        <div class="card-inner">

            <!-- Company -->
            <div class="company">
                <span class="company-name">Cirque du Soleil</span>
                <span class="company-sub">Entertainment Group</span>
            </div>

            <!-- Identity -->
            <div class="identity">
                <h1 class="name">Ray<br>Mark</h1>
                <div class="role">
                    <span class="job-title">Director of Marketing</span>
                    <span class="show-name">&#700;Auana</span>
                </div>
            </div>

            <div class="rule"></div>

            <!-- Weather + Local time -->
            <div class="widget">
                <div class="weather-left">
                    <div class="widget-label">
                        <svg width="7" height="9" viewBox="0 0 7 9" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3.5 0C1.84 0 .5 1.34.5 3c0 2.25 3 5.5 3 5.5s3-3.25 3-5.5C6.5 1.34 5.16 0 3.5 0zm0 4.12A1.12 1.12 0 1 1 3.5 1.88a1.12 1.12 0 0 1 0 2.24z" fill="currentColor"/>
                        </svg>
                        Honolulu, HI
                    </div>
                    <div class="weather-row">
                        <span class="w-icon" id="wIcon">–</span>
                        <span class="w-temp" id="wTemp">–</span>
                        <span class="w-unit">°F</span>
                    </div>
                    <span class="w-desc" id="wDesc">&nbsp;</span>
                </div>

                <div class="weather-right">
                    <div class="widget-label" style="justify-content:flex-end">
                        <svg width="9" height="9" viewBox="0 0 9 9" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="4.5" cy="4.5" r="3.75" stroke="currentColor" stroke-width="1"/>
                            <path d="M4.5 2.5v2.25l1.5 1" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        HST
                    </div>
                    <div class="local-time">
                        <span id="ltTime">–:––</span>
                        <span class="local-ampm" id="ltAmpm"></span>
                    </div>
                    <div class="local-date" id="ltDate"></div>
                </div>
            </div>

            <div class="rule"></div>

            <!-- Contact -->
            <div class="contact-list">
                <button class="contact-row" id="emailBtn" aria-label="Copy email address">
                    <span class="c-icon">
                        <svg width="13" height="10" viewBox="0 0 13 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x=".75" y=".75" width="11.5" height="8.5" rx="1.5" stroke="currentColor" stroke-width="1.1"/>
                            <path d="M.75 2.5 6.5 6 12.25 2.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <span class="c-text">ray.mark@cirquedusoleil.com</span>
                    <span class="c-badge" id="copyBadge">copy</span>
                </button>

                <a class="contact-row" href="tel:+18086474538" aria-label="Call work number">
                    <span class="c-icon">
                        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2 2.5a1 1 0 0 1 1-1h1.5l1 2.5-1.25 1.25a7.5 7.5 0 0 0 3.5 3.5L9 7.5l2.5 1V10a1 1 0 0 1-1 1C4.5 11 2 5.5 2 2.5z" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span class="c-text">808.647.4538</span>
                    <span class="c-badge">call</span>
                </a>

                <a class="contact-row" href="https://www.linkedin.com/in/rmark/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
                    <span class="c-icon">
                        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x=".75" y=".75" width="11.5" height="11.5" rx="2" stroke="currentColor" stroke-width="1.1"/>
                            <path d="M4 5.5v4M4 3.8v.4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                            <path d="M7 9.5V7a1.5 1.5 0 0 1 3 0v2.5M7 5.5v4" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </span>
                    <span class="c-text">LinkedIn</span>
                    <span class="c-badge">↗</span>
                </a>

                <a class="contact-row" href="https://www.instagram.com/rjmark/" target="_blank" rel="noopener noreferrer" aria-label="Instagram profile">
                    <span class="c-icon">
                        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x=".75" y=".75" width="11.5" height="11.5" rx="3" stroke="currentColor" stroke-width="1.1"/>
                            <circle cx="6.5" cy="6.5" r="2.25" stroke="currentColor" stroke-width="1.1"/>
                            <circle cx="9.75" cy="3.25" r="0.6" fill="currentColor"/>
                        </svg>
                    </span>
                    <span class="c-text">@rjmark</span>
                    <span class="c-badge">↗</span>
                </a>
            </div>

            <div class="rule"></div>

            <!-- vCard -->
            <a class="vcf-btn" href="/RayMarkContact.vcf" download="RayMark.vcf" aria-label="Download contact card">
                <svg width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="7.5" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.25"/>
                    <path d="M2 13c0-3.05 2.46-4 5.5-4s5.5.95 5.5 4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
                    <circle cx="11.5" cy="11.5" r="3" fill="currentColor" opacity=".15"/>
                    <path d="M11.5 9.5v4M9.5 11.5h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                </svg>
                Add to Contacts
            </a>

        </div><!-- /card-inner -->
    </article>

    <script>
    /* ── 3D tilt + sheen ── */
    (function () {
        const card  = document.getElementById('card');
        const sheen = document.getElementById('sheen');
        let raf;

        card.addEventListener('mousemove', e => {
            cancelAnimationFrame(raf);
            raf = requestAnimationFrame(() => {
                const r  = card.getBoundingClientRect();
                const nx = (e.clientX - r.left)  / r.width;
                const ny = (e.clientY - r.top)   / r.height;
                const tx = (ny - 0.5) * 15;
                const ty = (nx - 0.5) * -15;
                card.style.transform = `perspective(1000px) rotateX(${tx}deg) rotateY(${ty}deg) scale(1.018)`;
                card.style.boxShadow = `
                    0 0 0 1px rgba(184,146,76,.05),
                    ${-ty*.7}px ${tx*.7 + 30}px 60px rgba(0,0,0,.7),
                    0 80px 150px rgba(0,0,0,.35),
                    inset 0 1px 0 rgba(184,146,76,.18)
                `;
                sheen.style.background =
                    `radial-gradient(circle at ${nx*100}% ${ny*100}%, rgba(255,255,255,.065) 0%, transparent 55%)`;
            });
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform  = '';
            card.style.boxShadow  = '';
            sheen.style.background = '';
        });
    })();

    /* ── Weather — Open-Meteo (free, no key) ── */
    (function () {
        const WMO = {
            0:'☀️',  1:'🌤',  2:'⛅',  3:'☁️',
            45:'🌫', 48:'🌫', 51:'🌦', 53:'🌦', 55:'🌧',
            61:'🌧', 63:'🌧', 65:'🌧', 71:'🌨', 73:'🌨', 75:'🌨',
            77:'🌨', 80:'🌦', 81:'🌦', 82:'🌧',
            85:'🌨', 86:'🌨', 95:'⛈', 96:'⛈', 99:'⛈'
        };
        const DESC = {
            0:'Clear sky', 1:'Mostly clear', 2:'Partly cloudy', 3:'Overcast',
            45:'Foggy', 48:'Foggy', 51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
            61:'Light rain', 63:'Rain', 65:'Heavy rain', 71:'Light snow', 73:'Snow', 75:'Heavy snow',
            80:'Showers', 81:'Showers', 82:'Heavy showers', 95:'Thunderstorm'
        };

        async function load() {
            try {
                const r = await fetch(
                    'https://api.open-meteo.com/v1/forecast?latitude=21.3069&longitude=-157.8583' +
                    '&current_weather=true&temperature_unit=fahrenheit'
                );
                const d = await r.json();
                const { temperature, weathercode: wc } = d.current_weather;
                document.getElementById('wIcon').textContent = WMO[wc]  ?? '🌡️';
                document.getElementById('wTemp').textContent = Math.round(temperature);
                document.getElementById('wDesc').textContent = DESC[wc] ?? '';
            } catch {
                document.getElementById('wDesc').textContent = '–';
            }
        }
        load();
        setInterval(load, 10 * 60 * 1000);
    })();

    /* ── Live Honolulu time ── */
    (function () {
        function tick() {
            const now  = new Date();
            const time = now.toLocaleString('en-US', {
                timeZone: 'Pacific/Honolulu',
                hour: 'numeric', minute: '2-digit', hour12: true
            });
            const [hm, ap] = time.split(' ');
            const date = now.toLocaleString('en-US', {
                timeZone: 'Pacific/Honolulu',
                weekday: 'short', month: 'short', day: 'numeric'
            });
            document.getElementById('ltTime').textContent  = hm;
            document.getElementById('ltAmpm').textContent  = ap;
            document.getElementById('ltDate').textContent  = date;
        }
        tick();
        setInterval(tick, 1000);
    })();

    /* ── Copy email ── */
    (function () {
        const btn   = document.getElementById('emailBtn');
        const badge = document.getElementById('copyBadge');
        let timer;
        btn.addEventListener('click', () => {
            navigator.clipboard.writeText('ray.mark@cirquedusoleil.com')
                .then(() => {
                    badge.textContent = 'copied ✓';
                    badge.classList.add('ok');
                    clearTimeout(timer);
                    timer = setTimeout(() => {
                        badge.textContent = 'copy';
                        badge.classList.remove('ok');
                    }, 2500);
                })
                .catch(() => { window.location.href = 'mailto:ray.mark@cirquedusoleil.com'; });
        });
    })();
    </script>
</body>
</html>
