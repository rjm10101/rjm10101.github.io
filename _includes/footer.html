<section class="cta band-dark">
  <div class="container">
    <p class="label">Open to new roles · Hawaiʻi or remote</p>
    <h2 class="cta-title reveal">Hiring a marketing or creative director? Let’s talk.</h2>
    <div class="cta-foot reveal">
      <a class="cta-email" href="mailto:{{ site.email }}">{{ site.email }} <span class="arrow" aria-hidden="true">→</span></a>
      <div class="button-row">
        <a class="button" href="tel:{{ site.phone }}">Call</a>
        <a class="button" href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a class="button" href="{{ '/RayMarkContact.vcf' | relative_url }}" download>Save contact</a>
      </div>
    </div>
  </div>
</section>
<footer class="site-footer band-dark">
  <div class="container footer-inner">
    <p>© {{ site.time | date: '%Y' }} Raymond Mark</p>
    <p class="footer-time">Honolulu, Hawaiʻi <span class="footer-clock">— <span data-hnl-time>local time</span></span></p>
    <nav class="footer-nav" aria-label="Footer">
      <a href="{{ '/resume.html' | relative_url }}">Résumé</a>
      <a href="{{ site.linkedin }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="{{ '/RayMarkContact.vcf' | relative_url }}" download>vCard</a>
    </nav>
    <a class="footer-mark" href="{{ '/' | relative_url }}" aria-label="Ray Mark, home">{% include monogram.svg %}</a>
  </div>
</footer>
<dialog class="lightbox" aria-label="Enlarged image">
  <button class="lightbox-close" type="button" aria-label="Close">×</button>
  <figure>
    <img alt="">
    <figcaption></figcaption>
  </figure>
</dialog>
<div class="cursor-label" aria-hidden="true"></div>
<script src="{{ '/assets/scripts/script.js' | relative_url }}" defer></script>
