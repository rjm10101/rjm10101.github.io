<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Private site: keep it out of search engines and AI, and don't send referrers. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai">
<meta name="referrer" content="no-referrer">
{%- if page.title %}
<title>{{ page.title }} — Ray Mark</title>
{%- else %}
<title>Ray Mark — Marketing &amp; Creative Director, Honolulu</title>
{%- endif %}
{%- assign description = page.description | default: site.description %}
<meta name="description" content="{{ description | escape }}">
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Ray Mark">
<meta property="og:title" content="{% if page.title %}{{ page.title | append: ' — Ray Mark' | escape }}{% else %}Ray Mark — Marketing &amp; Creative Director, Honolulu{% endif %}">
<meta property="og:description" content="{{ description | escape }}">
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/og.jpg' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="675">
<meta name="twitter:card" content="summary_large_image">

<script>document.documentElement.classList.add('js');</script>
<link rel="preload" href="{{ '/assets/fonts/Archivo-Variable.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/DalaFloda-Bold-Web.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#0f0f0e">
<meta name="apple-mobile-web-app-title" content="Ray Mark">
<meta name="application-name" content="Ray Mark">
<meta name="msapplication-TileColor" content="#0f0f0e">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f3f1ec">

<!-- Google Analytics -->

<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-YQDXZEPYT9');
</script>
