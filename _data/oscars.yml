  - id: influencers
    label: Influencers
    title: The week before
    intro: "Influencer events built the story before the show: a Galaxy selfie station at The Hollywood Reporter’s Pret-A-Reporter party, a trivia game on the Galaxy Note Pro at the Motion Picture & Television Fund’s Night Before party, and Oscar viewing parties in five private homes across Los Angeles."
    stats:
