  - id: day-after
    label: The day after
    title: Keeping the moment going
    intro: "The next day, Ellen’s live post-Oscars show gave away 320 Galaxy Note 3s to the studio audience and became the highest-rated episode in the show’s 11-year history. Samsung marked the record by donating $3 million, $1.5 million each to St. Jude Children’s Research Hospital and the Humane Society of the United States. The Academy later added the selfie Note 3 to its collection."
    rows:
