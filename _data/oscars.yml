# Samsung Oscars Selfie case study (samsung-oscars.html), 86th Academy Awards,
# March 2, 2014. Figures come from the Samsung/Starcom campaign wrap-up and
# Cannes Lions entry; no media spend or valuation figures. Same structure as
# _data/auana.yml.

hero:
  label: Case study · Samsung
  title: The Oscars Selfie
  lead: "The first product integration in Oscars history put a Samsung Galaxy Note 3 in Ellen DeGeneres’ hands, live on ABC. Then she took a selfie."
  role: Associate Media Director, Starcom<br>2014
  image: Oscars-Selfie
  width: 1444
  height: 812
  alt: "Ellen DeGeneres’ Oscars selfie: Bradley Cooper holds the phone as Ellen, Jennifer Lawrence, Meryl Streep, Julia Roberts, Kevin Spacey, Brad Pitt, Angelina Jolie, Lupita Nyong’o, Jared Leto and Channing Tatum crowd into the frame."
  caption: The Oscars selfie, March 2, 2014

overview:
  title: Real moments in a scripted show
  meta:
    - { label: Role, value: "Associate Media Director, Starcom MediaVest Group" }
    - { label: Client, value: Samsung Mobile USA }
    - { label: Event, value: "86th Academy Awards, ABC, March 2, 2014" }
    - { label: Partners, value: "ABC, Twitter, E!, The Hollywood Reporter" }
  lead: "Drove paid media for the first-ever Oscars product integration, on Samsung Mobile at Starcom."
  body:
    - "Research showed two audiences watching two ways. The broadcast audience skews older, with a median age of 52. Samsung’s Millennial target followed the Oscars on social media, with TV playing a supporting role. They were also pushing back against polished, perfect images in favor of real moments, captured with humor and spontaneity."
    - "So the plan had to work on both screens and feel unplanned. On a night when everything is scripted, nothing is more real than a selfie."
    - "It worked with exactly the people Samsung needed: after the Oscars, its share of female smartphone users grew at more than twice the rate of its top competitor."

results:
  stats:
    - { value: 43.7M, label: "Viewers, the most-watched Oscars in 14 years" }
    - { value: 3.4M+, label: "Retweets, the most ever at the time" }
    - { value: $730M+, label: "Earned media value in the first 10 days" }
    - { value: +18%, label: "Likelihood to recommend Samsung, three weeks later" }
    - { value: +42%, label: Positive social sentiment }
    - { value: Cannes Lions, label: "Gold & Silver, 2014" }
  cols: 3
  note: "Results from Samsung’s March 2014 campaign wrap-up and its Cannes Lions and Effie entries. The selfie earned 2.1B impressions."

sections:
  - id: on-air
    label: On air
    title: Spontaneity takes a lot of work
    intro: "It started six months out, in upfront negotiations with ABC for full phone and half tablet category exclusivity. Research and planning followed two months before the show, then filming and training the week of: the Note 3 was set up so Ellen could use it comfortably on live TV. On the night she used it on stage and in the audience for nearly three minutes of screen time, then handed it to Bradley Cooper for a selfie with 12 A-list celebrities. Her tweet, “If only Bradley’s arm was longer. Best photo ever. #oscars,” beat the previous retweet record within 34 minutes and briefly took Twitter down."
    rows:
      - items:
          - image: Oscars-Ellen-Note-3
            width: 1600
            height: 1140
            alt: "Ellen DeGeneres on the Oscars stage holding up a white Samsung Galaxy Note 3 to take a photo."
            caption: Ellen with the Galaxy Note 3 on stage
          - image: Oscars-Selfie-Taken
            width: 960
            height: 528
            alt: "Bradley Cooper holds the Galaxy Note 3 at arm’s length as Ellen and the celebrities around her squeeze into the shot."
            caption: The selfie being taken

  - id: backstage
    label: Backstage
    title: Content made on the night
    intro: "The idea reached past the broadcast. With Twitter and ABC, a Galaxy Note 10.1 became a “Twitter Mirror” in the Oscars green room, where relaxed celebrities took selfies, signed them with the S Pen and tweeted them out. An interactive multimedia wall in the Architectural Digest Green Room put Samsung products to work there too."
    rows:
      - items:
          - image: Oscars-Green-Room-Wall
            width: 943
            height: 629
            alt: "The Architectural Digest Green Room at the Oscars: a wall of screens showing the ceremony beside a gold Oscar statue."
            caption: Architectural Digest Green Room · Multimedia wall
          - image: Oscars-Twitter-Mirror
            width: 585
            height: 392
            alt: "A tweet from @TheAcademy, promoted by Samsung Mobile US: “Backstage at the #Oscars in the #ArchDigestGreenRoom with Jason Sudeikis,” with his Twitter Mirror photo."
            caption: Twitter Mirror · A tweet from the green room

  - id: media
    label: Media
    title: Every screen, one message
    intro: "Around the moment, Samsung showed up wherever the audience was watching: five and a half minutes of “One Samsung” TV in the broadcast plus a pre-show spot, E! red-carpet integrations, takeovers of ABC.com, Oscars.com and E! Online, a promoted #TheNextBigThing trend on Twitter and a Facebook mobile reach block. The TV spots showed Samsung’s phone, tablet, TV and wearable together for the first time."
    stats:
      - { value: 80.5M, label: "Social impressions, 121% of goal" }
      - { value: 47.7M, label: "Impressions from the #TheNextBigThing Twitter trend" }
      - { value: 64.6M, label: Digital impressions }
      - { value: 58%, label: Share of all Oscars brand mentions }
    cols: 3
    rows:
