# Portfolio projects, grouped by category page. Each image needs
# assets/img/<image>.webp (1600px wide) and <image>-800.webp.
# "featured: true" projects are shown large at the top of their page, in this
# order; the rest appear in the compact "More work" grid.
branding:
- title: Greenbrier Holdings
  image: Logo-Greenbrier-Hldgs
  width: 1600
  height: 900
  alt: Greenbrier Holdings
  summary: "Greenbrier Holdings grew out of four generations of family farming before moving into cannabis. The corporate mark had to honor that history and still read as a serious operator."
  more: "Four bands of color run through the G, one for each generation on the land. It’s a quiet detail that tells the family story, set in a simple, solid shape that holds up across the company’s cultivation, manufacturing, and distribution businesses."
  featured: true
- title: Hannah Industries
  image: Logo-Hannah
  width: 1600
  height: 900
  alt: Hannah Industries
  summary: "Hannah Industries is a tier 2 cannabis producer in Washington that wanted to signal its industry without putting a leaf in the logo."
  more: "The mark is two interlocking green shapes, and the negative space between them forms the H. Color does the rest of the hinting: a restrained green that suggests the plant, paired with clean, modern type. The understated approach suits the buyers and partners a producer sells to, who want to deal with a company, not a novelty brand. A brand guidelines booklet for partners set the rules for logo use, color, and typography, so the brand stayed consistent even when partners produced their own materials."
  featured: true
  also:
    - image: Print-Hannah-BG
      width: 1600
      height: 900
      alt: Hannah Industries – Brand Guidelines
      caption: Brand guidelines
- title: Cannable
  image: Cannable-Logos
  width: 1600
  height: 900
  alt: "Two Cannable logos: the delivery mark with a car shape and the store mark with speed lines."
  summary: "Cannable needed two marks from day one: one for its delivery service and one for its store in Parlier, California. Both had to say fast and friendly at a glance."
  more: "The wordmark is set in heavy, rounded lowercase in a bright, confident blue. On the delivery mark, a little car rides on the first letters, with the round c and a as its wheels and speed lines trailing behind. The store mark keeps the wordmark and swaps the car for slanted speed lines, so the two read as one family. The system carries through the logo animation, stationery, and merch."
  case: /cannable.html
  featured: true
- title: Satori Salvation
  image: Logo-Satori-Salvation
  width: 1600
  height: 900
  alt: Satori Salvation
  summary: "Satori Salvation sells high-potency CBD in two directions: products that lift you up and products that settle you down. The logo had to hold both, and look expensive doing it."
  more: "Purple carries the energy and blue the calm. A woven border wraps the mark like a path being walked, a nod to satori, the Zen idea of sudden enlightenment, and a signal that this is a luxury brand."
- title: New England Hemp Farm
  image: Logo-NEHF
  width: 1600
  height: 900
  alt: New England Hemp Farm
  summary: "New England Hemp Farm makes CBD in a converted old firehouse in Connecticut, and the building is the brand’s best story."
  more: "The mark puts the firehouse in green above heavy block lettering, with a hemp leaf and the founding year below. In a crowded, look-alike CBD market, it gives the brand something most competitors don’t have: a real place and a story customers can repeat."
- title: Laughing Buddha
  image: Logo-Laughing-Buddha
  width: 1600
  height: 900
  alt: Laughing Buddha
  summary: "Laughing Buddha sells cannabis to a young, urban crowd in Washington. The logo needed to feel friendly and a little rebellious at the same time."
  more: "A grinning Buddha, drawn with the energy of street art, does both jobs. It’s welcoming enough for first-time shoppers and has enough edge to stand out in a market full of green leaves and serious type."
- title: 788 Technologies
  image: Logo-788-Technologies
  width: 1600
  height: 900
  alt: 788 Technologies
  summary: "788 Technologies combines lab science with CBD production. Its logo had to show both sides: the relief people feel and the science behind it."
  more: "A stylized human figure sits at the center, ringed by simplified molecular structures. The person comes first and the science surrounds them, which is how the company wants to be understood."
- title: Adaptiiv Grow Technologies
  image: Logo-Adaptiiv
  width: 1600
  height: 900
  alt: Adaptiiv Grow Technologies
  summary: "Adaptiiv makes cultivation systems for indoor growers, and cooling is the heart of its technology."
  more: "A fan is built into the letter A, so the logo explains the product at a glance. It reads as an engineering company first, which suits a brand selling equipment to growers who care about efficiency and sustainability."
- title: Bison & Rose
  image: Logo-Bison-Rose
  width: 1600
  height: 900
  alt: Bison & Rose
  summary: "Bison & Rose is an upscale CBD brand from Oklahoma that wanted to wear its home state proudly without looking rustic."
  more: "The bison and the rose are both Oklahoma state symbols. Paired in a refined lockup, they give the brand local pride and a luxury finish at once, and set it apart from generic wellness brands on the same shelf."
- title: Budtender Nation
  image: Logo-Budtender-Nation
  width: 1600
  height: 900
  alt: Budtender Nation
  summary: "Budtender Nation was built as a social network for the people behind the dispensary counter. Its logo had to feel optimistic about where the industry was going."
  more: "A cannabis leaf rises over the horizon like a sunrise, a simple picture of new opportunity for a growing profession. It gives the community something to rally around, and it holds up at small sizes, which matters for a brand that lives mostly online."
- title: Happy Camper
  image: Logo-Happy-Camper
  width: 1600
  height: 900
  alt: Happy Camper
  summary: "Happy Camper’s brand is built on the outdoors and on taking care of it, from compostable packaging to its love of national parks."
  more: "The retro logo borrows from vintage park signage, in earthy colors and old-school graphics. It feels nostalgic and friendly, and it tells eco-minded shoppers what the brand stands for before they read a word."
- title: Red Dirt
  image: Logo-Red-Dirt
  width: 1600
  height: 900
  alt: Red Dirt
  summary: "Red Dirt grows its cannabis under the Oklahoma sun and wanted a logo with some heritage to it."
  more: "A sunburst and gold tones point straight at the sungrown process, and vintage lettering gives the brand a rustic, established feel. It reads as authentic in a market where many brands look brand new."
- title: Brand Guidelines
  client: LeEco
  image: Presentation-LeEco-BG
  width: 1600
  height: 900
  alt: LeEco – Brand Guidelines
  summary: "LeEco’s U.S. consumer products division needed brand guidelines it could hand to any team or partner."
  more: "The guidelines set the rules for how the brand appeared across marketing and product interfaces. As LeEco expanded into new markets, they kept the identity consistent and saved teams from reinventing the basics."
- title: Brand Guidelines
  client: Simplifya
  image: Print-Simplifya-BG
  width: 1600
  height: 900
  alt: Simplifya – Brand Guidelines
  summary: "Simplifya’s brand guidelines booklet helps partners use the brand correctly."
  more: "It covers logo usage, color, and typography with clear dos and don’ts. Partners get a single reference they can check in seconds, and Simplifya gets consistent representation wherever its name appears, which matters for a compliance company whose whole pitch is getting the details right."

packaging:
- title: Satori Salvation
  image: Packaging-Satori-Salvation
  width: 1600
  height: 900
  alt: Satori Salvation Packaging
  summary: "Satori Salvation launched as a luxury CBD line, and the packaging had to justify the price before anyone opened a box."
  more: "Deep jewel tones and glossy rose-gold accents set the premium tone. The woven lines from the logo grow into flowing, intertwined patterns along the base of each label, carrying the brand’s idea of a path toward enlightenment across the whole range."
  featured: true
- title: Happy Camper
  image: Packaging-Happy-Camper
  width: 1600
  height: 900
  alt: Happy Camper Packaging
  summary: "Happy Camper’s Fire Sticks pre-rolls needed packaging that was compostable and recyclable, met Washington’s standards, and still looked good enough to pick up."
  more: "Each variety got its own time of day: Sunrise for sativa, Noon for hybrid, and Sunset for indica. The artwork tells shoppers what they’re buying at a glance and makes the line look like one family. Sustainable materials and strong design, without trading one for the other."
  featured: true
- title: New England Hemp Farm
  image: Packaging-NEHF
  width: 1600
  height: 900
  alt: New England Hemp Farm Packaging
  summary: "New England Hemp Farm wanted packaging that felt handmade and local, in keeping with a brand that started in an old firehouse."
  more: "Traditional sketch-style artwork of the hemp plant gives every label texture and a crafted feel. In a category where shoppers care about where a product comes from and what’s in it, the packaging starts building trust before anyone reads the label."
  featured: true
- title: Red Dirt
  image: Packaging-Red-Dirt
  width: 1600
  height: 900
  alt: Red Dirt Packaging
  summary: "Red Dirt’s cannabis is grown outdoors in natural sunlight, and the packaging needed to make that the first thing you notice."
  more: "Vintage styling, sunburst motifs, and earthy colors carry the logo’s heritage onto the shelf. It makes Red Dirt look grown rather than manufactured, which is the whole point for shoppers who want something closer to nature."
  featured: true
- title: Bison & Rose
  image: Packaging-Bison-Rose
  width: 1600
  height: 900
  alt: Bison & Rose Packaging
  summary: "Bison & Rose launched metered-dose inhalers in two strengths, Balanced and Intense, and the packaging had to make the difference obvious."
  more: "Each SKU got its own color scheme and artwork, so customers can pick the right strength without reading the fine print. The finishes keep the brand’s luxury feel, so clarity never comes at the cost of looking premium."
  featured: true
- title: Laughing Buddha
  image: Packaging-Laughing-Buddha
  width: 1600
  height: 900
  alt: Laughing Buddha Packaging
  summary: "Laughing Buddha carried the street-art style of its logo onto custom glass jars."
  more: "The labels feature a detailed street map of Seattle under gold foil: a little city pride with a little shine. The jars stand out on a dispensary shelf and are nice enough to keep, which keeps the brand in front of customers long after the sale."
  featured: true
