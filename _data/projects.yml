print:
- title: Grammy Awards Program Full Page Spread
  client: Dolby
  image: Print-Grammys-Program-Spread
  width: 1600
  height: 900
  alt: Dolby Grammy Awards Program
  summary: "For the 63rd Grammy Awards program, Dolby took a full page to congratulate the nominees and winners."
  more: "A band is silhouetted in theatrical light and haze, with the Dolby logo glowing behind them. The vivid palette stops a reader mid-flip, and the image puts Dolby where it wants to be for a music-industry audience: inside the sound of the night’s best performances."
  featured: true
- title: Cinema Trade Print
  client: Dolby
  image: Print-Dolby-Magazine
  width: 1600
  height: 900
  alt: Dolby – Cinema Trade Print
  summary: "Two full-page trade ads made the case to cinema owners and operators for upgrading to Dolby Cinema."
  more: "Instead of equipment, the ads show audiences, faces lit by the screen, clearly caught up in the film. The message to operators is simple: this is what your customers will feel. Behind the emotion sits the business case, a competitive edge and a return on the investment, which is what a B2B buyer signs off on."
  featured: true
