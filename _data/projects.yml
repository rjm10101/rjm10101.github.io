  more: "Avitas’s new packaging sits against vivid, dramatic nature photography. The headline makes the promise in three words and the copy backs it up: all-natural, full-spectrum extracts that keep their terpenes and cannabinoids for a consistent experience. For health-conscious shoppers comparing brands, that clarity is the difference."
  featured: true
- title: 'Consumer Print: Find Your Feel Good Moment'
