  - id: pau-hana
    label: Pau Hana Partners
    title: Dinner, parking, and a show
    intro: "Created Pau Hana Partners, a program with Waikīkī restaurants within a 10-minute walk of the theater, built to give guests more for their ticket without discounting it."
    body:
      - "It started with a problem. Parking was one of the most common complaints in our post-show surveys, and with no parking at the hotel for show guests, it was ours to solve. The ticket data added the rest: kamaʻāina planned ahead, booking a median of six days out, and 58% chose the 5:30 p.m. show, then went to dinner. Most nearby restaurants already validated parking for their guests. It just wasn’t being communicated."
      - "The mechanic is simple: show an ʻAuana ticket dated that day at a partner restaurant for a complimentary treat and validated parking. The ticket is the only token, so there was no new price type, no promo code, and no discounting, and no money changed hands in either direction."
      - "Partners got pre-show diners and a post-show wave from a 784-seat house that lets out twice a night, a listing on the ʻAuana website, in pre-show emails, and in the digital program, plus quarterly tickets for their staff. Each restaurant rang the perk under its own POS comp code, giving both sides a clean redemption count for quarterly reviews."
    stats:
      - { value: "784", label: "Seats, in a house that lets out twice a night" }
      - { value: 10 min, label: "Or less, on foot from every partner to the theater" }
      - { value: $0, label: "Exchanged between the show and its partners: no fees, discounts, or commissions" }
    rows:
      - narrow: true
        items:
          - image: Auana-Pau-Hana-Banner
            width: 778
            height: 394
            alt: "Interactive program banner on dark gray: “Your ticket is good for more than your seat!” above “Local Dining Perks” and a Learn more button, beside a photo of ahi tuna rolls."
            caption: Interactive program — Local Dining Perks banner
      - items:
