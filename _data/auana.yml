    title: The ʻAuana brand guidelines
    intro: "The brand had to feel rooted in Hawaiʻi and unmistakably Cirque du Soleil at the same time."
    body:
      - "The identity draws on kapa, traditional Hawaiian printmaking: bark cloth beaten soft, then hand-printed with carved bamboo stamps. Each of the show’s scenes owns a color and a pattern, so the system can flex across every act and still read as one show."
      - "Developed the brand guidelines and the show’s two key visuals, each made in portrait and landscape. The performers were shot on green screen, then keyed and composited onto the volcanic ridge."
