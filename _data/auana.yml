  - id: kamaaina
    label: Kamaʻāina and offers
    title: A show for locals, too
    intro: "Visitors were always going to find ʻAuana. The show also had to belong to Hawaiʻi."
    body:
      - "The kamaʻāina (local) strategy gave residents their own pricing, their own nights, and reasons to come back. Offers built for families and soft dates filled the gaps when visitor demand dipped, from Aloha Fridays to a 24-hour Fourth of July sale."
    stats:
      - { value: 119K+, label: "Local tickets ($10.4M)" }
      - { value: $530K+, label: "Aloha Fridays, which more than halved the Friday late-show occupancy gap" }
      - { value: $3M+, label: Family program }
      - { value: 33% → 67%, label: "Occupancy for a soft show, from a 24-hour July 4 BOGO" }
      - { value: $411K, label: "Black Friday/Cyber Monday, 5,374 tickets" }
