# Cirque du Soleil ʻAuana case study (auana.html).
# Sections render in this order; rows render left to right at equal heights,
# so any mix of portrait and landscape pieces lines up. Reorder freely.
# Images: assets/img/<image>.webp (long edge up to 1600) + <image>-800.webp;
# width/height are the main file's real size.
# Set "narrow: true" on a row to cap it at about half the page width.
# Add "back: { image, alt }" to a two-sided piece (same size as the front) to
# show it as a card with a "See the back" flip button. Name the sides with
# "sides: [Driver side, Passenger side]" (default Front, Back).

hero:
  label: Case study · Cirque du Soleil
  title: ʻAuana
  lead: "Brand, creative, and sales for Cirque du Soleil’s first resident show in Hawaiʻi, at the OUTRIGGER Waikīkī Beachcomber Hotel."
  role: Director of Marketing<br>2024 – 2026
  image: Auana-Key-Visual
  width: 1600
  height: 900
  large: 2400
  alt: "The ʻAuana key visual: performers in Hawaiian costume on a volcanic ridge under a sunrise sky, with the Cirque du Soleil ʻAuana wordmark and the tagline “A new sun rises in Hawaiʻi.”"
  caption: Key visual

overview:
  title: Hawaiʻi’s first resident Cirque du Soleil show
  meta:
    - { label: Role, value: Director of Marketing }
    - { label: Dates, value: Aug 2024 – Oct 2026 }
    - { label: Location, value: "Honolulu, Hawaiʻi" }
    - { label: Venue, value: OUTRIGGER Waikīkī Beachcomber Hotel }
  lead: "Led marketing for ʻAuana, Cirque du Soleil’s first resident show in Hawaiʻi, from the first announcement through its first two years."
  body:
    - "There was no blueprint: a new show, in a new theater, in a market where Cirque du Soleil had never had a permanent home. Owned the $2M+ annual sales, marketing, and communications budget against KPI and EBITDA targets, led a team of three managers and a coordinator, and managed U.S. media and sales agencies, plus partner agencies in Japan and Korea."
    - "Developed the brand guidelines and key visuals, and produced all of the creative in-house, from paid media and print to on-property signage and partner campaigns. Keeping the work in-house kept it fast and on-brand, and put more of the budget into media."
    - "The show had two audiences to win. For visitors, the job was reaching people once they landed: expanding in-market media grew visitor ticket sales 15% (+$960K) on 4% fewer shows. For kamaʻāina, it was giving locals their own reasons to come, and come back."
  quote: "In a world with zero blueprints, bringing Hawaiʻi’s first resident Cirque du Soleil show to life… takes constant adaptation and a calm center amidst the chaos."
  quote_source: Pacific Edge Magazine
  quote_url: https://lnkd.in/p/gi7iyJRZ

results:
  stats:
