sections:
  - id: idea
    label: The idea
    title: The power to be anywhere but here
    intro: "Decals framed the power sockets on pillars, walls and baseboards, with one line for whoever was plugged in: “So you have the power to be anywhere but here.” It pointed to Ultra Power Saving Mode at the exact moment a dying battery was the problem."
    rows:
      - items:
          - image: Samsung-Wallhuggers-Gate
            width: 1600
            height: 1150
            alt: "A traveler at an airport gate looks at her phone, plugged into an outlet on a column under a Galaxy S5 decal reading “So you have the power to be anywhere but here.”"
            caption: At the gate
          - image: Samsung-Wallhuggers-Pink
            width: 1280
            height: 1017
            alt: "A traveler in a neck pillow sits on the floor texting, her phone plugged into a Galaxy S5 outlet decal on a steel pillar."
            caption: On the floor by a pillar

  - id: placements
    label: Placements
    title: 416 outlets in two weeks
    intro: "There was no off-the-shelf way to buy an airport power outlet, so the deals were cut directly with all four airports. In August 2014, 416 placements went up across 15 terminals at JFK, Newark, O’Hare and Midway, all within two weeks."
    rows:
      - items:
          - image: Samsung-Wallhuggers-Pillar-Seated
            width: 625
