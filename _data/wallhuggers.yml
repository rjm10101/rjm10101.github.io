# Samsung Wallhuggers case study (wallhuggers.html), Galaxy S5, August 2014.
# Airports, timing and tagline from 2014 press coverage (linked in the press
# section); results from the earlier Samsung page. No media spend figures.
# Same structure as _data/oscars.yml.

hero:
  label: Case study · Samsung
  title: Wallhuggers
  lead: "Travelers were already stuck on the airport floor, next to an outlet, waiting for a charge. So Samsung put its ad on the outlet."
  role: Associate Media Director, Starcom<br>2014
  image: Samsung-Wallhuggers-Hero
  width: 1600
  height: 766
  alt: "Four travelers sitting on an airport floor along a grey wall, each charging a phone at an outlet framed by a Samsung Galaxy S5 decal."
  caption: Wallhuggers, Galaxy S5

overview:
  title: A new medium, found at the outlet
  meta:
    - { label: Role, value: "Associate Media Director, Starcom MediaVest Group" }
    - { label: Client, value: Samsung Mobile USA }
    - { label: Product, value: Galaxy S5 }
    - { label: Airports, value: "JFK, Newark, O’Hare and Midway" }
    - { label: Dates, value: August 2014 }
  lead: "Pioneered a new out-of-home format in U.S. airports for the Galaxy S5."
  body:
    - "When an iPhone software update made battery drain worse, Samsung’s “Wall Huggers” TV spots poked fun at iPhone owners camped next to outlets. The Galaxy S5 had the answer in Ultra Power Saving Mode, which stretches a low battery by switching the screen to black and white and shutting down everything but the essentials."
    - "Nowhere was the problem more visible than at the airport, where travelers sit on the floor by any outlet they can find. So the outlet itself became the ad."

